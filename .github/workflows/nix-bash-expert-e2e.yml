name: Nix Bash Expert E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-nix-expert/**'
      - 'plugins/zara-bash-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_nix_bash_dotfiles_brain_e2e.py'
      - 'tests/test_nix_bash_no_parallel_tools.py'
      - 'tests/test_nix_bash_shared_composition_e2e.py'
      - 'tests/test_nix_bash_zara_core_e2e.py'
      - 'flake.nix'
      - 'plugins.json'
      - '.github/workflows/nix-bash-expert-e2e.yml'

permissions:
  contents: read

concurrency:
  group: nix-bash-expert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-brains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact canonical Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=1b93e01f3482e49a853f651eb28c21eb1d9cad0e
          rm -rf .ci/dotfiles-nix-bash
          git init .ci/dotfiles-nix-bash
          git -C .ci/dotfiles-nix-bash remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-nix-bash config core.sparseCheckout true
          mkdir -p .ci/dotfiles-nix-bash/.git/info
          printf '%s\n' \
            '/.zara/experts/nix/' \
            '/.zara/experts/bash/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-nix-bash/.git/info/sparse-checkout
          git -C .ci/dotfiles-nix-bash fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-nix-bash checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-nix-bash rev-parse HEAD)" = "$revision"

      - name: Fetch exact canonical Zara Core
        shell: bash
        run: |
          set -euo pipefail
          revision=fded1099e82f315b069676d1aadd66fe96aebccc
          rm -rf .ci/zara-core
          git init .ci/zara-core
          git -C .ci/zara-core remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core config core.sparseCheckout true
          mkdir -p .ci/zara-core/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core/.git/info/sparse-checkout
          git -C .ci/zara-core fetch --depth=1 origin "$revision"
          git -C .ci/zara-core checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtimes and audit tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Prove canonical zero-model read-only brains and host path
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-nix-bash
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -p 'test_nix_bash_dotfiles_brain_e2e.py'

      - name: Prove shared expert composition through canonical Core
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-nix-bash
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/nix-bash-shared-composition-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_nix_bash_shared_composition_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during pure-symbolic shared composition E2E' >&2
            cat "$trace" >&2
            exit 1
          fi

      - name: Prove no adapter-local parallel expert tool surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -p 'test_nix_bash_no_parallel_tools.py'

      - name: Prove Zara Core fences with no provider credentials or network fallback
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-nix-bash
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/nix-bash-core-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_nix_bash_zara_core_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during pure-symbolic Core E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
