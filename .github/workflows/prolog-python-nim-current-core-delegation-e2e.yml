name: Prolog Python Nim Current Core Delegation E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-prolog-expert/**'
      - 'plugins/zara-python-expert/**'
      - 'plugins/zara-nim-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_prolog_python_nim_current_core_delegation_e2e.py'
      - '.github/workflows/prolog-python-nim-current-core-delegation-e2e.yml'

permissions:
  contents: read

concurrency:
  group: prolog-python-nim-current-core-delegation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-current-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=fe8f7fa3c42803e0e505dcb6f7e4600d27649d9e
          rm -rf .ci/dotfiles-prolog-python-nim-current
          git init .ci/dotfiles-prolog-python-nim-current
          git -C .ci/dotfiles-prolog-python-nim-current remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-prolog-python-nim-current config core.sparseCheckout true
          mkdir -p .ci/dotfiles-prolog-python-nim-current/.git/info
          printf '%s\n' \
            '/.zara/experts/prolog/' \
            '/.zara/experts/python/' \
            '/.zara/experts/nim/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-prolog-python-nim-current/.git/info/sparse-checkout
          git -C .ci/dotfiles-prolog-python-nim-current fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-prolog-python-nim-current checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-prolog-python-nim-current rev-parse HEAD)" = "$revision"

      - name: Fetch exact current Zara Core
        shell: bash
        run: |
          set -euo pipefail
          revision=36e6d48fa750f30b5493f0c2acc789f3e9300e97
          rm -rf .ci/zara-core-current
          git init .ci/zara-core-current
          git -C .ci/zara-core-current remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-current config core.sparseCheckout true
          mkdir -p .ci/zara-core-current/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-current/.git/info/sparse-checkout
          git -C .ci/zara-core-current fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-current checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-current rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove real language delegation through current Zara Core
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-prolog-python-nim-current
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-current
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/prolog-python-nim-current-core-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_prolog_python_nim_current_core_delegation_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during current-Core Prolog/Python/Nim delegation E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
