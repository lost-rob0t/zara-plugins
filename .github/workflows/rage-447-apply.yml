name: RAGE 447 apply

on:
  push:
    branches:
      - rage/447-avatar-directory-policy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rage/447-avatar-directory-policy
      - name: Apply exact avatar directory policy patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("plugins/zara-avatar/zara-plugin/zara_avatar.py")
          text = path.read_text(encoding="utf-8")
          marker = '''        self._avatar_directory = str(
                      configuration.get("avatar_directory", DEFAULT_AVATAR_DIRECTORY)
                  )
                  if not self._avatar_directory.strip():
                      raise ValueError("avatar_directory must be a non-empty path")
          '''
          replacement = '''        avatar_directory = configuration.get(
                      "avatar_directory", DEFAULT_AVATAR_DIRECTORY
                  )
                  if not isinstance(avatar_directory, str) or not avatar_directory.strip():
                      raise ValueError("avatar_directory must be a non-empty path string")
                  self._avatar_directory = avatar_directory
          '''
          if text.count(marker) != 1:
              raise SystemExit("avatar_directory policy insertion point drifted")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          Path(".github/workflows/rage-447-apply.yml").unlink()
          PY
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/zara-avatar/zara-plugin/zara_avatar.py .github/workflows/rage-447-apply.yml
          git diff --cached --check
          git commit -m 'fix: validate avatar state directory policy'
          git push origin HEAD:rage/447-avatar-directory-policy
