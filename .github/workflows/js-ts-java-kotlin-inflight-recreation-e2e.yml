name: JS TS Java Kotlin Inflight Recreation E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-javascript-expert/**'
      - 'plugins/zara-typescript-expert/**'
      - 'plugins/zara-java-expert/**'
      - 'plugins/zara-kotlin-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_js_ts_java_kotlin_inflight_recreation_e2e.py'
      - '.github/workflows/js-ts-java-kotlin-inflight-recreation-e2e.yml'

permissions:
  contents: read

concurrency:
  group: js-ts-java-kotlin-inflight-recreation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-inflight-recreation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=fe8f7fa3c42803e0e505dcb6f7e4600d27649d9e
          rm -rf .ci/dotfiles-js-ts-java-kotlin-inflight
          git init .ci/dotfiles-js-ts-java-kotlin-inflight
          git -C .ci/dotfiles-js-ts-java-kotlin-inflight remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-js-ts-java-kotlin-inflight config core.sparseCheckout true
          mkdir -p .ci/dotfiles-js-ts-java-kotlin-inflight/.git/info
          printf '%s\n' \
            '/.zara/experts/javascript/' \
            '/.zara/experts/typescript/' \
            '/.zara/experts/java/' \
            '/.zara/experts/kotlin/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-js-ts-java-kotlin-inflight/.git/info/sparse-checkout
          git -C .ci/dotfiles-js-ts-java-kotlin-inflight fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-js-ts-java-kotlin-inflight checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-js-ts-java-kotlin-inflight rev-parse HEAD)" = "$revision"

      - name: Fetch exact current Zara Core
        shell: bash
        run: |
          set -euo pipefail
          revision=3909dd259e7ce689fcd3e4f132cd5e0045387b78
          rm -rf .ci/zara-core-js-ts-java-kotlin-inflight
          git init .ci/zara-core-js-ts-java-kotlin-inflight
          git -C .ci/zara-core-js-ts-java-kotlin-inflight remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-js-ts-java-kotlin-inflight config core.sparseCheckout true
          mkdir -p .ci/zara-core-js-ts-java-kotlin-inflight/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-js-ts-java-kotlin-inflight/.git/info/sparse-checkout
          git -C .ci/zara-core-js-ts-java-kotlin-inflight fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-js-ts-java-kotlin-inflight checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-js-ts-java-kotlin-inflight rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove in-flight JS TS Java Kotlin fences across reload and recreation
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-js-ts-java-kotlin-inflight
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-js-ts-java-kotlin-inflight
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/js-ts-java-kotlin-inflight-recreation-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_js_ts_java_kotlin_inflight_recreation_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during JS/TS + Java/Kotlin recreation E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
