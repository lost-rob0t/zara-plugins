name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Run compatibility gate contract tests
        run: python3 -m unittest discover -s tests -t .

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Capture source compatibility diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          nix build .#checks.x86_64-linux.compatibility --print-build-logs 2>&1 | tee source-compatibility.log

      - name: Capture installed compatibility diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          nix build .#checks.x86_64-linux.installed-compatibility --print-build-logs 2>&1 | tee installed-compatibility.log

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-diagnostics
          path: |
            source-compatibility.log
            installed-compatibility.log
          if-no-files-found: error

      - name: Run registry and plugin tests
        run: nix flake check --print-build-logs

      - name: Build plugin packages
        run: nix build
