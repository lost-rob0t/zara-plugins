name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Run compatibility gate contract tests
        run: python3 -m unittest discover -s tests -t .

      - name: Check out canonical Dotfiles expert brains
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/dotfiles
          ref: 423a00e4a93fbea8d191502b29b1d6ab0e1333fd
          path: .ci/dotfiles
          persist-credentials: true
          sparse-checkout: |
            .zara/experts
          sparse-checkout-cone-mode: false

      - name: Install SWI-Prolog for canonical brain E2E
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Run canonical Dotfiles language brain E2E
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s plugins/zara-expert/test \
            -t plugins/zara-expert/test \
            -p 'test_dotfiles_language_brain_integration.py'

      - name: Run canonical Dotfiles Lisp brain E2E
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s plugins/zara-expert/test \
            -t plugins/zara-expert/test \
            -p 'test_dotfiles_lisp_brain_integration.py'

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Capture source compatibility diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          nix build .#checks.x86_64-linux.compatibility --print-build-logs 2>&1 | tee source-compatibility.log

      - name: Capture installed compatibility diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          nix build .#checks.x86_64-linux.installed-compatibility --print-build-logs 2>&1 | tee installed-compatibility.log

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-diagnostics
          path: |
            source-compatibility.log
            installed-compatibility.log
          if-no-files-found: error

      - name: Run registry and plugin tests
        shell: bash
        run: |
          set -o pipefail
          nix flake check --print-build-logs 2>&1 | tee flake-check.log

      - name: Upload flake check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-check-diagnostics
          path: flake-check.log
          if-no-files-found: error

      - name: Build plugin packages
        run: nix build

  avatar-renderer-cpu:
    name: zara-avatar idle CPU budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/avatar-renderer-cpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/zara-avatar/renderer/package-lock.json

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install renderer dependencies
        working-directory: plugins/zara-avatar/renderer
        run: npm ci

      - name: Enforce real Electron idle CPU budget
        run: xvfb-run -a python3 scripts/check-avatar-renderer-cpu.py

      - name: Upload CPU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-renderer-cpu
          path: artifacts/avatar-renderer-cpu/
          if-no-files-found: warn
