name: RAGE 407 apply

on:
  push:
    branches:
      - rage/407-avatar-renderer-policy-replay

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rage/407-avatar-renderer-policy-replay
      - name: Apply exact renderer policy patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("plugins/zara-avatar/zara-plugin/zara_avatar.py")
          text = path.read_text(encoding="utf-8")

          marker = '''class RendererRequestError(Exception):
              """A renderer request failed, timed out, or was answered with an error."""


          class RendererHost:
          '''
          replacement = '''class RendererRequestError(Exception):
              """A renderer request failed, timed out, or was answered with an error."""


          def _positive_finite_timeout(value: object, name: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise ValueError(f"{name} must be a finite positive number")
              number = float(value)
              if not math.isfinite(number) or number <= 0.0:
                  raise ValueError(f"{name} must be a finite positive number")
              return number


          class RendererHost:
          '''
          if text.count(marker) != 1:
              raise SystemExit("renderer helper insertion point drifted")
          text = text.replace(marker, replacement, 1)

          marker = '''    ) -> None:
                  if not command or not all(isinstance(part, str) for part in command):
                      raise ValueError("renderer command must be a list of strings")
                  self.command = list(command)
                  self.startup_timeout = startup_timeout
                  self.request_timeout = request_timeout
                  self.shutdown_grace = shutdown_grace
          '''
          replacement = '''    ) -> None:
                  if (
                      not isinstance(command, (list, tuple))
                      or not command
                      or not all(isinstance(part, str) and part for part in command)
                  ):
                      raise ValueError(
                          "renderer command must be a non-empty sequence of non-empty strings"
                      )
                  self.command = list(command)
                  self.startup_timeout = _positive_finite_timeout(
                      startup_timeout, "startup_timeout"
                  )
                  self.request_timeout = _positive_finite_timeout(
                      request_timeout, "request_timeout"
                  )
                  self.shutdown_grace = _positive_finite_timeout(
                      shutdown_grace, "shutdown_grace"
                  )
          '''
          if text.count(marker) != 1:
              raise SystemExit("renderer constructor insertion point drifted")
          text = text.replace(marker, replacement, 1)

          marker = '''    ) -> dict:
                  if command not in self.allowed_commands:
                      raise ValueError(f"unknown renderer command {command!r}")
          '''
          replacement = '''    ) -> dict:
                  wait = self.request_timeout
                  if timeout is not None:
                      wait = _positive_finite_timeout(timeout, "timeout")
                  if command not in self.allowed_commands:
                      raise ValueError(f"unknown renderer command {command!r}")
          '''
          if text.count(marker) != 1:
              raise SystemExit("renderer request insertion point drifted")
          text = text.replace(marker, replacement, 1)

          marker = '''        wait = self.request_timeout if timeout is None else timeout
                  try:
                      reply = replies.get(timeout=wait)
          '''
          replacement = '''        try:
                      reply = replies.get(timeout=wait)
          '''
          if text.count(marker) != 1:
              raise SystemExit("renderer request wait point drifted")
          text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/rage-407-apply.yml").unlink()
          PY
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/zara-avatar/zara-plugin/zara_avatar.py .github/workflows/rage-407-apply.yml
          git diff --cached --check
          git commit -m 'fix: validate avatar renderer process policy'
          git push origin HEAD:rage/407-avatar-renderer-policy-replay
