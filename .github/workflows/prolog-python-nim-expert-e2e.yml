name: Prolog Python Nim Expert E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-prolog-expert/**'
      - 'plugins/zara-python-expert/**'
      - 'plugins/zara-nim-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_prolog_python_nim_zara_core_e2e.py'
      - '.github/workflows/prolog-python-nim-expert-e2e.yml'

permissions:
  contents: read

concurrency:
  group: prolog-python-nim-expert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact canonical Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=1b93e01f3482e49a853f651eb28c21eb1d9cad0e
          rm -rf .ci/dotfiles-prolog-python-nim
          git init .ci/dotfiles-prolog-python-nim
          git -C .ci/dotfiles-prolog-python-nim remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-prolog-python-nim config core.sparseCheckout true
          mkdir -p .ci/dotfiles-prolog-python-nim/.git/info
          printf '%s\n' \
            '/.zara/experts/prolog/' \
            '/.zara/experts/python/' \
            '/.zara/experts/nim/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-prolog-python-nim/.git/info/sparse-checkout
          git -C .ci/dotfiles-prolog-python-nim fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-prolog-python-nim checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-prolog-python-nim rev-parse HEAD)" = "$revision"

      - name: Fetch exact canonical Zara Core
        shell: bash
        run: |
          set -euo pipefail
          revision=fded1099e82f315b069676d1aadd66fe96aebccc
          rm -rf .ci/zara-core
          git init .ci/zara-core
          git -C .ci/zara-core remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core config core.sparseCheckout true
          mkdir -p .ci/zara-core/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core/.git/info/sparse-checkout
          git -C .ci/zara-core fetch --depth=1 origin "$revision"
          git -C .ci/zara-core checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove real Prolog Python Nim composition through Zara Core
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-prolog-python-nim
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/prolog-python-nim-core-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_prolog_python_nim_zara_core_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during Prolog/Python/Nim pure-symbolic Core E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
