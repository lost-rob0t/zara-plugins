name: JS TS Java Kotlin Root Cancellation E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-javascript-expert/**'
      - 'plugins/zara-typescript-expert/**'
      - 'plugins/zara-java-expert/**'
      - 'plugins/zara-kotlin-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_js_ts_java_kotlin_inflight_recreation_e2e.py'
      - 'tests/test_js_ts_java_kotlin_root_cancellation_e2e.py'
      - '.github/workflows/js-ts-java-kotlin-root-cancellation-e2e.yml'

permissions:
  contents: read

concurrency:
  group: js-ts-java-kotlin-root-cancellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-root-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=fe8f7fa3c42803e0e505dcb6f7e4600d27649d9e
          rm -rf .ci/dotfiles-js-ts-java-kotlin-root-cancel
          git init .ci/dotfiles-js-ts-java-kotlin-root-cancel
          git -C .ci/dotfiles-js-ts-java-kotlin-root-cancel remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-js-ts-java-kotlin-root-cancel config core.sparseCheckout true
          mkdir -p .ci/dotfiles-js-ts-java-kotlin-root-cancel/.git/info
          printf '%s\n' \
            '/.zara/experts/language/' \
            '/.zara/experts/javascript/' \
            '/.zara/experts/typescript/' \
            '/.zara/experts/java/' \
            '/.zara/experts/kotlin/' \
            > .ci/dotfiles-js-ts-java-kotlin-root-cancel/.git/info/sparse-checkout
          git -C .ci/dotfiles-js-ts-java-kotlin-root-cancel fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-js-ts-java-kotlin-root-cancel checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-js-ts-java-kotlin-root-cancel rev-parse HEAD)" = "$revision"

      - name: Fetch exact merged Zara Core root-cancellation fix
        shell: bash
        run: |
          set -euo pipefail
          revision=8177460982f94a5a60cf454c2fd4f9beae867a95
          rm -rf .ci/zara-core-js-ts-java-kotlin-root-cancel
          git init .ci/zara-core-js-ts-java-kotlin-root-cancel
          git -C .ci/zara-core-js-ts-java-kotlin-root-cancel remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-js-ts-java-kotlin-root-cancel config core.sparseCheckout true
          mkdir -p .ci/zara-core-js-ts-java-kotlin-root-cancel/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-js-ts-java-kotlin-root-cancel/.git/info/sparse-checkout
          git -C .ci/zara-core-js-ts-java-kotlin-root-cancel fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-js-ts-java-kotlin-root-cancel checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-js-ts-java-kotlin-root-cancel rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove root cancellation recursively fences JS TS Java Kotlin
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-js-ts-java-kotlin-root-cancel
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-js-ts-java-kotlin-root-cancel
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/js-ts-java-kotlin-root-cancellation-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_js_ts_java_kotlin_root_cancellation_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during four-language root cancellation E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
