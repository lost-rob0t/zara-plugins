name: Lisp Current Core Verified Outcome E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-expert/**'
      - 'tests/test_lisp_current_core_verified_outcome_e2e.py'
      - '.github/workflows/lisp-current-core-verified-outcome-e2e.yml'

permissions:
  contents: read

concurrency:
  group: lisp-current-core-verified-outcome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-current-core-verified-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles Lisp brains
        shell: bash
        run: |
          set -euo pipefail
          revision=3309c54ecb5f65c29374de6c60d2135a9ea2f94b
          rm -rf .ci/dotfiles-lisp-current
          git init .ci/dotfiles-lisp-current
          git -C .ci/dotfiles-lisp-current remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-lisp-current config core.sparseCheckout true
          mkdir -p .ci/dotfiles-lisp-current/.git/info
          printf '%s\n' \
            '/.zara/experts/lisp/' \
            '/.zara/experts/common-lisp/' \
            '/.zara/experts/emacs-lisp/' \
            > .ci/dotfiles-lisp-current/.git/info/sparse-checkout
          git -C .ci/dotfiles-lisp-current fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-lisp-current checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-lisp-current rev-parse HEAD)" = "$revision"

      - name: Fetch exact current Zara Core
        shell: bash
        run: |
          set -euo pipefail
          revision=29aaaab83ff2ebb27f483c47e43403c1fc252574
          rm -rf .ci/zara-core-current
          git init .ci/zara-core-current
          git -C .ci/zara-core-current remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-current config core.sparseCheckout true
          mkdir -p .ci/zara-core-current/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-current/.git/info/sparse-checkout
          git -C .ci/zara-core-current fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-current checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-current rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove fresh verified outcome through current Zara Core
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-lisp-current
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-current
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/lisp-current-core-verified-outcome-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_lisp_current_core_verified_outcome_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during current-Core Lisp verified-outcome E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
