name: Dotfiles Expert E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-expert/**'
      - 'tests/test_dotfiles_zara_core_e2e.py'
      - 'tests/test_dotfiles_style_expert_e2e.py'
      - 'tests/test_dotfiles_style_chain_e2e.py'
      - '.github/workflows/dotfiles-expert-e2e.yml'

permissions:
  contents: read

concurrency:
  group: dotfiles-expert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-dotfiles-expert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Fetch exact stable DotfilesExpert producer
        shell: bash
        run: |
          set -euo pipefail
          revision=fe8f7fa3c42803e0e505dcb6f7e4600d27649d9e
          rm -rf .ci/dotfiles-expert
          git init .ci/dotfiles-expert
          git -C .ci/dotfiles-expert remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-expert config core.sparseCheckout true
          mkdir -p .ci/dotfiles-expert/.git/info
          printf '%s\n' \
            '/.zara/experts/dotfiles/' \
            '/.zara/experts/nix/' \
            '/.zara/experts/bash/' \
            '/.zara/experts/language/' \
            '/.zara/style/' \
            '/.prolog/kb/' \
            > .ci/dotfiles-expert/.git/info/sparse-checkout
          git -C .ci/dotfiles-expert fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-expert checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-expert rev-parse HEAD)" = "$revision"

      - name: Fetch exact pending Dotfiles StyleExpert producer
        shell: bash
        run: |
          set -euo pipefail
          revision=4fc75059cd0eb242559e0ec2786e7d78875a310d
          rm -rf .ci/dotfiles-style-expert
          git init .ci/dotfiles-style-expert
          git -C .ci/dotfiles-style-expert remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-style-expert config core.sparseCheckout true
          mkdir -p .ci/dotfiles-style-expert/.git/info
          printf '%s\n' \
            '/.zara/experts/dotfiles/' \
            '/.zara/experts/nix/' \
            '/.zara/experts/bash/' \
            '/.zara/experts/language/' \
            '/.zara/experts/style/' \
            '/.zara/style/' \
            '/.prolog/kb/' \
            > .ci/dotfiles-style-expert/.git/info/sparse-checkout
          git -C .ci/dotfiles-style-expert fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-style-expert checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-style-expert rev-parse HEAD)" = "$revision"

      - name: Fetch exact canonical Zara Core
        shell: bash
        run: |
          set -euo pipefail
          revision=f7810b0cba602b1e00597d04dd419d30ac0ef949
          rm -rf .ci/zara-core
          git init .ci/zara-core
          git -C .ci/zara-core remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core config core.sparseCheckout true
          mkdir -p .ci/zara-core/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core/.git/info/sparse-checkout
          git -C .ci/zara-core fetch --depth=1 origin "$revision"
          git -C .ci/zara-core checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core rev-parse HEAD)" = "$revision"

      - name: Fetch exact current Zara Core for complete composition chain
        shell: bash
        run: |
          set -euo pipefail
          revision=4f30f9f18c06ba3a5daf11122e0e2a8af30f7095
          rm -rf .ci/zara-core-current
          git init .ci/zara-core-current
          git -C .ci/zara-core-current remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-current config core.sparseCheckout true
          mkdir -p .ci/zara-core-current/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-current/.git/info/sparse-checkout
          git -C .ci/zara-core-current fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-current checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-current rev-parse HEAD)" = "$revision"

      - name: Fetch exact generic Prolog-RLM style runtime
        shell: bash
        run: |
          set -euo pipefail
          revision=4715b5ee53d0e7a26c55705ea85c0d16c3916504
          rm -rf .ci/prolog-rlm
          git init .ci/prolog-rlm
          git -C .ci/prolog-rlm remote add origin https://github.com/lost-rob0t/prolog-rlm.git
          git -C .ci/prolog-rlm config core.sparseCheckout true
          mkdir -p .ci/prolog-rlm/.git/info
          printf '%s\n' \
            '/prolog/rlm_style_overlay.pl' \
            '/test/run_style_overlay_contract.pl' \
            > .ci/prolog-rlm/.git/info/sparse-checkout
          git -C .ci/prolog-rlm fetch --depth=1 origin "$revision"
          git -C .ci/prolog-rlm checkout --detach FETCH_HEAD
          test "$(git -C .ci/prolog-rlm rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and audit tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove upstream generic style runtime stays zero-model and offline
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/prolog-rlm-style-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            swipl -q -s .ci/prolog-rlm/test/run_style_overlay_contract.pl
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during Prolog-RLM style contract' >&2
            cat "$trace" >&2
            exit 1
          fi

      - name: Prove Dotfiles adapter unit contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 plugins/zara-expert/test/test_catalog_composition.py
          python3 plugins/zara-expert/test/test_dotfiles_family.py
          python3 plugins/zara-expert/test/test_dotfiles_style.py
          python3 plugins/zara-expert/test/test_dotfiles_style_expert.py
          python3 plugins/zara-expert/test/test_dotfiles_style_meta_composition.py
          python3 plugins/zara-expert/test/test_dotfiles_style_chain.py
          python3 plugins/zara-expert/test/test_style_runtime.py

      - name: Prove real canonical StyleExpert producer stays zero-model and offline
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-style-expert
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/dotfiles-style-expert-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_dotfiles_style_expert_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during pure-symbolic StyleExpert E2E' >&2
            cat "$trace" >&2
            exit 1
          fi

      - name: Prove real Dotfiles root and child delegation through canonical Core
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-expert
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/dotfiles-core-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_dotfiles_zara_core_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during pure-symbolic DotfilesExpert E2E' >&2
            cat "$trace" >&2
            exit 1
          fi

      - name: Prove one DotfilesExpert to language to StyleExpert zero-model chain
        env:
          ZARA_DOTFILES_CHAIN_ROOT: ${{ github.workspace }}/.ci/dotfiles-style-expert
          ZARA_CORE_CURRENT_ROOT: ${{ github.workspace }}/.ci/zara-core-current
          PROLOG_RLM_ROOT: ${{ github.workspace }}/.ci/prolog-rlm
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/dotfiles-style-chain-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_dotfiles_style_chain_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during pure-symbolic Dotfiles style chain E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
