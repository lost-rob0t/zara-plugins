name: Zara Companion Android
on:
  pull_request:
    paths:
      - 'plugins/zara-avatar/companion/**'
      - 'plugins/zara-avatar/renderer/package*.json'
      - '.github/workflows/companion-android.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/zara-avatar/companion/**'
      - 'plugins/zara-avatar/renderer/package*.json'
      - '.github/workflows/companion-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Motion, model-input and package tests
        run: |
          node --test plugins/zara-avatar/companion/test/*.test.mjs
          python3 -m unittest discover -s plugins/zara-avatar/companion/test -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Load update-compatible Companion signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ZARA_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ZARA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            echo "Zara Companion release signing secret is unavailable." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/zara-companion-debug.keystore"
          printf '%s' "$ZARA_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ZARA_ANDROID_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Restore existing integrity-pinned renderer packages without Electron
        working-directory: plugins/zara-avatar/renderer
        run: npm ci --omit=dev --ignore-scripts
      - name: Build and lint the standalone APK
        working-directory: plugins/zara-avatar/companion
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Record source and artifact hashes
        run: |
          mkdir -p companion-artifact
          cp plugins/zara-avatar/companion/app/build/outputs/apk/debug/app-debug.apk companion-artifact/zara-companion-debug.apk
          git rev-parse HEAD > companion-artifact/SOURCE_SHA.txt
          sha256sum companion-artifact/zara-companion-debug.apk > companion-artifact/SHA256SUMS
          cp plugins/zara-avatar/companion/app/build/generated/rendererAssets/companion/dependencies.json companion-artifact/
          cp plugins/zara-avatar/companion/app/build/generated/fixtureAssets/default-avatar.* companion-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: zara-companion-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: companion-artifact/
          if-no-files-found: error
  renderer-e2e:
    needs: companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: zara-companion-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install playwright==1.57.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: Real APK loader and pixel-renderer E2E
        shell: bash
        run: |
          set -euo pipefail
          base=plugins/zara-avatar/companion
          python "$base/tools/make_test_vrm.py" candidate/Zara-Test-Bot.vrm
          python "$base/e2e/run_loader.py" --apk candidate/zara-companion-debug.apk --model candidate/Zara-Test-Bot.vrm --report e2e-evidence/loader.json
          chromium=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python "$base/e2e/render_smoke.py" --apk candidate/zara-companion-debug.apk --model candidate/Zara-Test-Bot.vrm --output e2e-evidence/renderer --chromium "$chromium"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-renderer-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: e2e-evidence/
          if-no-files-found: error
  android-overlay-e2e:
    needs: companion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: zara-companion-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/
      - name: Generate original offline test model
        run: python plugins/zara-avatar/companion/tools/make_test_vrm.py candidate/Zara-Test-Bot.vrm
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python plugins/zara-avatar/companion/e2e/android_smoke.py --serial emulator-5554 --apk candidate/zara-companion-debug.apk --model candidate/Zara-Test-Bot.vrm --output android-e2e-evidence --install --emulator --test-device-consent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-android-e2e-api${{ matrix.api-level }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: android-e2e-evidence/
          if-no-files-found: error
  companion-gate:
    if: always()
    needs: [companion, renderer-e2e, android-overlay-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Companion gate to succeed
        env:
          BUILD_RESULT: ${{ needs.companion.result }}
          RENDERER_RESULT: ${{ needs.renderer-e2e.result }}
          ANDROID_RESULT: ${{ needs.android-overlay-e2e.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$RENDERER_RESULT" = success
          test "$ANDROID_RESULT" = success

  publish-companion-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [companion, renderer-e2e, android-overlay-e2e, companion-gate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: zara-companion-debug-${{ github.sha }}
          path: candidate/
      - name: Verify exact signed candidate and publish rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat candidate/SOURCE_SHA.txt)" = "$GITHUB_SHA"
          test "$(sha256sum candidate/zara-companion-debug.apk | awk '{print $1}')" = "$(awk '{print $1}' candidate/SHA256SUMS)"
          git fetch origin main --tags --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish a source outside main." >&2
            exit 1
          fi
          previous="$(git rev-parse -q --verify 'refs/tags/companion-android-latest^{commit}' || true)"
          if [[ -n "$previous" && "$previous" != "$GITHUB_SHA" ]]; then
            if git merge-base --is-ancestor "$GITHUB_SHA" "$previous"; then
              echo "companion-android-latest already points at a newer main build; keeping it there."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$previous" "$GITHUB_SHA"; then
              echo "Refusing divergent companion-android-latest history." >&2
              exit 1
            fi
          fi
          git tag -f companion-android-latest "$GITHUB_SHA"
          git push --force origin refs/tags/companion-android-latest

          mkdir -p release
          cp candidate/zara-companion-debug.apk release/zara-companion-latest.apk
          (cd release && sha256sum zara-companion-latest.apk > zara-companion-latest.apk.sha256)
          {
            echo "source_sha=$GITHUB_SHA"
            echo "version_name=0.1.0-alpha.3"
            echo "version_code=3"
            echo "package=ai.zara.companion"
            echo "channel=companion-android-latest"
            echo "signing=update-compatible-debug"
          } > release/zara-companion-latest.manifest.txt
          notes="Rolling Zara Companion Android alpha from main commit $GITHUB_SHA. Includes the VRM overlay, built-in animation/dances, and on-device genre+tempo dance preference learning. This is a sideloaded update-compatible debug-signed prerelease, not a Play Store production build. Verify the APK with its checksum and manifest."
          if gh release view companion-android-latest >/dev/null 2>&1; then
            gh release upload companion-android-latest release/* --clobber
            gh release edit companion-android-latest --title "Zara Companion Android latest" --notes "$notes" --prerelease
          else
            gh release create companion-android-latest release/* --title "Zara Companion Android latest" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
