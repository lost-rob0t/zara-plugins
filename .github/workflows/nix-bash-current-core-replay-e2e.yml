name: Nix Bash Current Core Replay E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-nix-expert/**'
      - 'plugins/zara-bash-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_nix_bash_current_core_replay_e2e.py'
      - 'tests/test_nix_bash_current_core_delegation_e2e.py'
      - '.github/workflows/nix-bash-current-core-replay-e2e.yml'

permissions:
  contents: read

concurrency:
  group: nix-bash-current-core-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact canonical Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=1b93e01f3482e49a853f651eb28c21eb1d9cad0e
          rm -rf .ci/dotfiles-nix-bash-replay
          git init .ci/dotfiles-nix-bash-replay
          git -C .ci/dotfiles-nix-bash-replay remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-nix-bash-replay config core.sparseCheckout true
          mkdir -p .ci/dotfiles-nix-bash-replay/.git/info
          printf '%s\n' \
            '/.zara/experts/nix/' \
            '/.zara/experts/bash/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-nix-bash-replay/.git/info/sparse-checkout
          git -C .ci/dotfiles-nix-bash-replay fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-nix-bash-replay checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-nix-bash-replay rev-parse HEAD)" = "$revision"

      - name: Fetch exact Zara Core replay authority
        shell: bash
        run: |
          set -euo pipefail
          revision=3cc472ca342868a0a3a3797e4e88371a6bbc390b
          rm -rf .ci/zara-core-nix-bash-replay
          git init .ci/zara-core-nix-bash-replay
          git -C .ci/zara-core-nix-bash-replay remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-nix-bash-replay config core.sparseCheckout true
          mkdir -p .ci/zara-core-nix-bash-replay/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-nix-bash-replay/.git/info/sparse-checkout
          git -C .ci/zara-core-nix-bash-replay fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-nix-bash-replay checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-nix-bash-replay rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove current Core replay is idempotent, zero-model, and read-only
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-nix-bash-replay
          ZARA_CURRENT_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-nix-bash-replay
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/nix-bash-current-core-replay-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_nix_bash_current_core_replay_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during Nix/Bash current-Core replay E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
