name: P0 Nix Bash Duplicate JSON Patch

on:
  push:
    branches:
      - p0/nix-bash-duplicate-json-keys

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact duplicate-key fence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = (
              (
                  Path("plugins/zara-nix-expert/lib/zara_nix_expert/plugin.py"),
                  "NixExpertAdapterError",
              ),
              (
                  Path("plugins/zara-bash-expert/lib/zara_bash_expert/plugin.py"),
                  "BashExpertAdapterError",
              ),
          )

          for path, error_name in targets:
              text = path.read_text()
              anchor = (
                  'def _reject_json_constant(_value: str) -> None:\n'
                  '    raise ValueError("non-finite JSON number")\n'
              )
              helper = (
                  anchor
                  + '\n\n'
                  + 'def _reject_duplicate_object_pairs(\n'
                  + '    pairs: list[tuple[str, object]],\n'
                  + ') -> dict[str, object]:\n'
                  + '    value: dict[str, object] = {}\n'
                  + '    for key, child in pairs:\n'
                  + '        if key in value:\n'
                  + f'            raise {error_name}("ambiguous-input-json")\n'
                  + '        value[key] = child\n'
                  + '    return value\n'
              )
              if text.count(anchor) != 1:
                  raise SystemExit(f"unexpected duplicate-helper anchor count for {path}")
              text = text.replace(anchor, helper, 1)

              old = '            value = json.loads(input_json, parse_constant=_reject_json_constant)'
              new = (
                  '            value = json.loads(\n'
                  '                input_json,\n'
                  '                parse_constant=_reject_json_constant,\n'
                  '                object_pairs_hook=_reject_duplicate_object_pairs,\n'
                  '            )'
              )
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected json.loads anchor count for {path}")
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Focused RED-to-GREEN gate
        run: python3 -m unittest discover -s tests -p 'test_nix_bash_duplicate_json_keys.py' -t .
      - name: Compatibility gate
        run: python3 -m unittest discover -s tests -t .
      - name: Commit repair and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p0-nix-bash-duplicate-json-patch.yml
          git add -f plugins/zara-nix-expert/lib/zara_nix_expert/plugin.py plugins/zara-bash-expert/lib/zara_bash_expert/plugin.py
          git commit -m "fix: reject duplicate JSON keys in Nix/Bash requests"
          git push origin HEAD:p0/nix-bash-duplicate-json-keys
