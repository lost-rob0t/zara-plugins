name: Prolog Python Nim Unsupported Follow-up E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/zara-prolog-expert/**'
      - 'plugins/zara-python-expert/**'
      - 'plugins/zara-nim-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_prolog_python_nim_surface_parity_e2e.py'
      - 'tests/test_prolog_python_nim_unsupported_followup_e2e.py'
      - '.github/workflows/prolog-python-nim-unsupported-followup-e2e.yml'

permissions:
  contents: read

concurrency:
  group: prolog-python-nim-unsupported-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsupported-followup-after-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=97534b85f96a5ae7962762268440fb9ae7815ae0
          rm -rf .ci/dotfiles-prolog-python-nim-unsupported
          git init .ci/dotfiles-prolog-python-nim-unsupported
          git -C .ci/dotfiles-prolog-python-nim-unsupported remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-prolog-python-nim-unsupported config core.sparseCheckout true
          mkdir -p .ci/dotfiles-prolog-python-nim-unsupported/.git/info
          printf '%s\n' \
            '/.zara/experts/prolog/' \
            '/.zara/experts/python/' \
            '/.zara/experts/nim/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-prolog-python-nim-unsupported/.git/info/sparse-checkout
          git -C .ci/dotfiles-prolog-python-nim-unsupported fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-prolog-python-nim-unsupported checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-prolog-python-nim-unsupported rev-parse HEAD)" = "$revision"

      - name: Fetch exact current Zara conversation contracts
        shell: bash
        run: |
          set -euo pipefail
          revision=9ff68d63b76c1db39689867f848d47c83c49cbcc
          rm -rf .ci/zara-core-unsupported-followup
          git init .ci/zara-core-unsupported-followup
          git -C .ci/zara-core-unsupported-followup remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-unsupported-followup config core.sparseCheckout true
          mkdir -p .ci/zara-core-unsupported-followup/.git/info
          printf '%s\n' \
            '/zara/' \
            '/modules/' \
            '/android/app/src/main/java/ai/zara/app/history/SymbolicConversationProjection.kt' \
            > .ci/zara-core-unsupported-followup/.git/info/sparse-checkout
          git -C .ci/zara-core-unsupported-followup fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-unsupported-followup checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-unsupported-followup rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace
          python3 -m pip install 'pykka>=3.1' 'langchain-core>=0.2'

      - name: Prove unsupported follow-up fails closed after project switch and restart
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-prolog-python-nim-unsupported
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-unsupported-followup
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/prolog-python-nim-unsupported-followup-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest -v tests.test_prolog_python_nim_unsupported_followup_e2e
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during unsupported follow-up E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
