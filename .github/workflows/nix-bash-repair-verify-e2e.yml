name: Nix Bash Repair Verify E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-nix-expert/**'
      - 'plugins/zara-bash-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_nix_bash_repair_verify_e2e.py'
      - '.github/workflows/nix-bash-repair-verify-e2e.yml'

permissions:
  contents: read

concurrency:
  group: nix-bash-repair-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-brain-repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact package-pinned Dotfiles Nix/Bash brains
        shell: bash
        run: |
          set -euo pipefail
          revision=1b93e01f3482e49a853f651eb28c21eb1d9cad0e
          rm -rf .ci/dotfiles-nix-bash-repair-verify
          git init .ci/dotfiles-nix-bash-repair-verify
          git -C .ci/dotfiles-nix-bash-repair-verify remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-nix-bash-repair-verify config core.sparseCheckout true
          mkdir -p .ci/dotfiles-nix-bash-repair-verify/.git/info
          printf '%s\n' \
            '/.zara/experts/nix/' \
            '/.zara/experts/bash/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-nix-bash-repair-verify/.git/info/sparse-checkout
          git -C .ci/dotfiles-nix-bash-repair-verify fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-nix-bash-repair-verify checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-nix-bash-repair-verify rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove real Nix/Bash repair verification stays pure symbolic and fail closed
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-nix-bash-repair-verify
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/nix-bash-repair-verify-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_nix_bash_repair_verify_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during pure-symbolic Nix/Bash repair verification E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
