name: JS TS Java Kotlin Current Master E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-javascript-expert/**'
      - 'plugins/zara-typescript-expert/**'
      - 'plugins/zara-java-expert/**'
      - 'plugins/zara-kotlin-expert/**'
      - 'plugins/zara-expert/lib/zara_expert/language_*.py'
      - 'tests/test_js_ts_java_kotlin_current_core_delegation_e2e.py'
      - 'tests/test_js_ts_java_kotlin_current_master_delegation_e2e.py'
      - '.github/workflows/js-ts-java-kotlin-current-master-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/zara-javascript-expert/**'
      - 'plugins/zara-typescript-expert/**'
      - 'plugins/zara-java-expert/**'
      - 'plugins/zara-kotlin-expert/**'
      - 'plugins/zara-expert/lib/zara_expert/language_*.py'
      - 'tests/test_js_ts_java_kotlin_current_core_delegation_e2e.py'
      - 'tests/test_js_ts_java_kotlin_current_master_delegation_e2e.py'
      - '.github/workflows/js-ts-java-kotlin-current-master-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-master-delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout zara-plugins
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=fe8f7fa3c42803e0e505dcb6f7e4600d27649d9e
          rm -rf .ci/dotfiles-js-ts-java-kotlin-current
          git init .ci/dotfiles-js-ts-java-kotlin-current
          git -C .ci/dotfiles-js-ts-java-kotlin-current remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-js-ts-java-kotlin-current config core.sparseCheckout true
          mkdir -p .ci/dotfiles-js-ts-java-kotlin-current/.git/info
          cat > .ci/dotfiles-js-ts-java-kotlin-current/.git/info/sparse-checkout <<'EOF'
          /.zara/experts/language/
          /.zara/experts/javascript/
          /.zara/experts/typescript/
          /.zara/experts/java/
          /.zara/experts/kotlin/
          EOF
          git -C .ci/dotfiles-js-ts-java-kotlin-current fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-js-ts-java-kotlin-current checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-js-ts-java-kotlin-current rev-parse HEAD)" = "$revision"

      - name: Fetch exact current Zara Core authority
        shell: bash
        run: |
          set -euo pipefail
          revision=0561fdbeadde3c2d7ed4ac94c5427f0c10421dac
          rm -rf .ci/zara-core-current-master
          git init .ci/zara-core-current-master
          git -C .ci/zara-core-current-master remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-current-master config core.sparseCheckout true
          mkdir -p .ci/zara-core-current-master/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-current-master/.git/info/sparse-checkout
          git -C .ci/zara-core-current-master fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-current-master checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-current-master rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox strace

      - name: Prove exact-current package and host boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_expert_factory_4_packages \
            tests.test_expert_factory_canonical_host_abi \
            tests.test_expert_factory_source_locks

      - name: Prove exact-current real four-language zero-model delegation
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-js-ts-java-kotlin-current
          ZARA_CURRENT_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-current-master
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/js-ts-java-kotlin-current-master-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest \
              tests.test_js_ts_java_kotlin_current_master_delegation_e2e
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during exact-current JS/TS/Java/Kotlin delegation E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
