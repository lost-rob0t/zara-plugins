name: Prolog Python Nim Root Cancellation E2E

on:
  pull_request:
    paths:
      - 'plugins/zara-prolog-expert/**'
      - 'plugins/zara-python-expert/**'
      - 'plugins/zara-nim-expert/**'
      - 'plugins/zara-expert/**'
      - 'tests/test_prolog_python_nim_inflight_cancellation_e2e.py'
      - 'tests/test_prolog_python_nim_root_cancellation_e2e.py'
      - '.github/workflows/prolog-python-nim-root-cancellation-e2e.yml'

permissions:
  contents: read

concurrency:
  group: prolog-python-nim-root-cancellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-root-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch exact current Dotfiles brains
        shell: bash
        run: |
          set -euo pipefail
          revision=fe8f7fa3c42803e0e505dcb6f7e4600d27649d9e
          rm -rf .ci/dotfiles-prolog-python-nim-root-cancel
          git init .ci/dotfiles-prolog-python-nim-root-cancel
          git -C .ci/dotfiles-prolog-python-nim-root-cancel remote add origin https://github.com/lost-rob0t/dotfiles.git
          git -C .ci/dotfiles-prolog-python-nim-root-cancel config core.sparseCheckout true
          mkdir -p .ci/dotfiles-prolog-python-nim-root-cancel/.git/info
          printf '%s\n' \
            '/.zara/experts/prolog/' \
            '/.zara/experts/python/' \
            '/.zara/experts/nim/' \
            '/.zara/experts/language/' \
            > .ci/dotfiles-prolog-python-nim-root-cancel/.git/info/sparse-checkout
          git -C .ci/dotfiles-prolog-python-nim-root-cancel fetch --depth=1 origin "$revision"
          git -C .ci/dotfiles-prolog-python-nim-root-cancel checkout --detach FETCH_HEAD
          test "$(git -C .ci/dotfiles-prolog-python-nim-root-cancel rev-parse HEAD)" = "$revision"

      - name: Fetch exact merged Zara Core root-cancellation revision
        shell: bash
        run: |
          set -euo pipefail
          revision=8177460982f94a5a60cf454c2fd4f9beae867a95
          rm -rf .ci/zara-core-root-cancel
          git init .ci/zara-core-root-cancel
          git -C .ci/zara-core-root-cancel remote add origin https://github.com/lost-rob0t/zara.git
          git -C .ci/zara-core-root-cancel config core.sparseCheckout true
          mkdir -p .ci/zara-core-root-cancel/.git/info
          printf '%s\n' '/zara/' > .ci/zara-core-root-cancel/.git/info/sparse-checkout
          git -C .ci/zara-core-root-cancel fetch --depth=1 origin "$revision"
          git -C .ci/zara-core-root-cancel checkout --detach FETCH_HEAD
          test "$(git -C .ci/zara-core-root-cancel rev-parse HEAD)" = "$revision"

      - name: Install symbolic runtime and network audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox strace

      - name: Prove root cancellation recursively fences required descendants
        env:
          ZARA_DOTFILES_ROOT: ${{ github.workspace }}/.ci/dotfiles-prolog-python-nim-root-cancel
          ZARA_CORE_ROOT: ${{ github.workspace }}/.ci/zara-core-root-cancel
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/prolog-python-nim-root-cancellation-network.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            strace -f -e trace=network -o "$trace" \
            python3 -m unittest discover -s tests -t . -p 'test_prolog_python_nim_root_cancellation_e2e.py'
          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during root cancellation E2E' >&2
            cat "$trace" >&2
            exit 1
          fi
